name: Deploy Application to TEST (ProductDemo)

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - qa

jobs:
  deploy-to-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch your code from the GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup pnpm package manager matching your local setup
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      # 3. Set up Node.js environment matching engine restrictions (Node 24)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # 4. Clean install project dependencies using pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 5. Compile the ServiceNow Fluent app code locally
      - name: Build ServiceNow Application
        run: pnpm run build

      # 6. Inline OAuth Handshake (Replaces the action.yml entirely)
      - name: Configure OAuth Authentication Environment
        run: |
          echo "SN_SDK_NODE_ENV=SN_SDK_CI_INSTALL" >> "$GITHUB_ENV"
          echo "SN_SDK_AUTH_TYPE=${{ vars.SN_SDK_TEST_AUTH_TYPE }}" >> "$GITHUB_ENV"
          echo "SN_SDK_INSTANCE_URL=${{ vars.SN_SDK_TEST_INSTANCE_URL }}" >> "$GITHUB_ENV"
          echo "SN_SDK_OAUTH_CLIENT_ID=${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "SN_SDK_OAUTH_CLIENT_SECRET=${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_SECRET }}" >> "$GITHUB_ENV"

      # 7. Deploy using the explicit host parameter so the SDK catches the OAuth environment variables
      - name: Install App to TEST
        run: |
          npx @servicenow/sdk install --host "${{ vars.SN_SDK_TEST_INSTANCE_URL }}"
