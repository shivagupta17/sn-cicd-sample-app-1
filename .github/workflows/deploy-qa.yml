name: Deploy Application to TEST (ProductDemo)

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - qa

jobs:
  deploy-to-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Fetch your code from the GitHub repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup pnpm package manager matching your exact local version (v12)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      # 3. Set up Node.js environment matching engine restrictions (Node >= 24)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      # 4. Clean install project dependencies using pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 5. Compile the ServiceNow Fluent app code locally
      - name: Build ServiceNow Application
        run: pnpm run build

      # 6. Authenticate with the TEST instance using OAuth
      - name: Authenticate with TEST Instance
        run: |
          npx now-sdk auth \
            --host "${{ secrets.SN_SDK_TEST_INSTANCE_URL }}" \
            --auth-type "${{ secrets.SN_SDK_TEST_AUTH_TYPE }}" \
            --client-id "${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_ID }}" \
            --client-secret "${{ secrets.SN_SDK_TEST_OAUTH_CLIENT_SECRET }}"

      # 7. Deploy the compiled package onto productdemo
      - name: Install App to TEST
        run: |
          npx now-sdk install --host "${{ secrets.SN_SDK_TEST_INSTANCE_URL }}"
